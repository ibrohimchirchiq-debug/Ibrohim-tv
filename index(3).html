<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12062e"><meta name="color-scheme" content="dark only"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800&display=swap" rel="stylesheet"><title>IBROHIM TV</title>
<style>
:root{color-scheme:dark only;--bg:#12062e;--cd:#1f0d4d;--cd2:#2b1468;--tx:#fff;--mu:#b9acf0;--p:#ff2d95;--c:#00e5ff;--y:#ffe600;--g:linear-gradient(120deg,#ff2d95,#ff7a00,#ffe600,#2dff8a,#00e5ff,#7c4dff,#ff2d95);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:500 15px/1.35 "Trebuchet MS",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes flow{to{background-position:300% 0}}@keyframes bar{0%{width:0}100%{width:100%}}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.gt{background:linear-gradient(90deg,#ff2d95,#ffe600,#00e5ff);-webkit-background-clip:text;background-clip:text;color:transparent}.sp .gt{background:var(--g);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;animation:flow 4s linear infinite}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:radial-gradient(circle at 50% 38%,#3b137f,#12062e 70%);transition:opacity .7s,visibility .7s}
#splash.off{opacity:0;visibility:hidden}
.ring{position:relative;width:min(66vw,290px);aspect-ratio:1;border-radius:50%;animation:pop .8s both}
.ring:before,.ring:after{content:"";position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);animation:spin 1.8s linear infinite}
.ring:after{filter:blur(22px);opacity:.9;animation-duration:2.6s;animation-direction:reverse}
.ring img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:55% 28%;z-index:2;border:4px solid var(--bg)}
.sp h1{font-size:40px;letter-spacing:3px;text-align:center;font-weight:900}
.sp p{color:var(--mu);text-align:center;margin-top:6px;font-size:13px}
.ld{width:min(60vw,240px);height:6px;border-radius:9px;background:#ffffff22;overflow:hidden}
.ld i{display:block;height:100%;border-radius:9px;background:var(--g);background-size:300% 100%;animation:bar 2.6s ease-out forwards,flow 2s linear infinite}
#app{height:100%;display:flex;flex-direction:column;padding-top:var(--st)}
header{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
header b{font-size:22px;font-weight:900;letter-spacing:1px;white-space:nowrap}
#q{flex:1;min-width:0;border-radius:22px;border:2px solid #ffffff22;background:var(--cd);color:var(--tx);padding:9px 14px;font:inherit;outline:0}
#q:focus{border-color:var(--c)}
#pl{display:none;background:#000;position:relative}#pl.on{display:block}
#v{width:100%;aspect-ratio:16/9;background:#000;display:block}
#lo{position:absolute;left:0;right:0;top:0;aspect-ratio:16/9;display:none;place-items:center;pointer-events:none}#lo.on{display:grid}
#lo i{width:44px;height:44px;border-radius:50%;border:5px solid transparent;border-top-color:var(--p);border-right-color:var(--c);animation:spin .8s linear infinite}
.pb{display:flex;align-items:center;gap:6px;padding:8px 10px;background:linear-gradient(90deg,#3b137f,#7a1b6e)}
.pb div{flex:1;min-width:0}.pb strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pb small{color:var(--mu)}
.pb button{width:38px;height:38px;border-radius:12px;background:#ffffff1f;font-size:17px}
main{flex:1;overflow-y:auto;padding:4px 12px 16px;-webkit-overflow-scrolling:touch}
.v{display:none}.v.on{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
.chips button{flex:none;padding:7px 15px;border-radius:20px;background:var(--cd2);color:var(--mu);font-weight:700}
.chips button.on{background:linear-gradient(120deg,#ff2d95,#7c4dff);color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:9px;margin-bottom:8px;border-radius:16px;background:var(--cd);border:2px solid transparent}
.row.on{border-color:var(--p)}
.lg{flex:none;width:50px;height:50px;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden;font-weight:900;color:#7c4dff;font-size:20px}
.lg img{width:100%;height:100%;object-fit:contain}
.row .n{flex:1;min-width:0}.row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{color:var(--mu)}
.st{font-size:22px;padding:6px;filter:opacity(.55)}.st.on{filter:none}
.card{background:var(--cd);border-radius:20px;padding:16px;margin-bottom:12px}
.card h3{margin-bottom:10px;font-size:17px}
.card input[type=text],.card textarea{width:100%;border-radius:14px;border:2px solid #ffffff22;background:var(--bg);color:var(--tx);padding:11px 13px;font:inherit;outline:0;margin-bottom:10px}
.card textarea{height:96px;resize:none}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:linear-gradient(120deg,#ff2d95,#7c4dff);color:#fff;font-weight:900;margin-bottom:8px;text-align:center}
.btn.s{background:var(--cd2);color:var(--tx)}
.em{text-align:center;padding:40px 16px;color:var(--mu)}.em .big{font-size:54px}
nav{display:flex;background:var(--cd);padding:6px 6px calc(6px + var(--sb));border-top:2px solid #ffffff14}
nav button{flex:1;padding:8px 0 6px;border-radius:16px;color:var(--mu);font-size:12px;font-weight:700;transition:.2s}
nav button .nosvg{display:block;margin:0 auto 3px;width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff;box-shadow:inset 0 -3px 0 var(--p)}
#t{position:fixed;left:50%;bottom:calc(84px + var(--sb));transform:translateX(-50%);background:var(--p);color:#fff;padding:10px 18px;border-radius:22px;font-weight:700;z-index:50;opacity:0;pointer-events:none;transition:.3s;max-width:88vw;text-align:center}#t.on{opacity:1}
.pl{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #ffffff14}.pl b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pl button{padding:7px 12px;border-radius:12px;background:var(--cd2)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

function qShow(){const H=hls;if(!H||!H.levels||H.levels.length<2)return qHide();
const a=H.levels.map((l,i)=>({i,h:l.height||0,b:l.bitrate||0}));
const cnt={};a.forEach(l=>{const k=l.h||l.b;cnt[k]=(cnt[k]||0)+1});
a.forEach(l=>{const kb=l.b?Math.round(l.b/1000)+' kbps':'#'+(l.i+1);l.t=l.h?l.h+'p'+(cnt[l.h]>1?' · '+kb:''):kb});
a.sort((x,y)=>(y.h-x.h)||(y.b-x.b));qlv=a;$('#pq').classList.remove('dm');$('#oq').classList.remove('dm')}
function qApply(){const H=hls,p=cfg.q;if(!H)return;
if(!p||p==='auto'||!qlv.some(l=>l.h)){H.currentLevel=-1;return}
let b=null;for(const l of qlv)if(l.h&&l.h<=p&&(!b||l.h>b.h||(l.h===b.h&&l.b>b.b)))b=l;
if(!b)b=[...qlv].reverse().find(l=>l.h);H.currentLevel=b.i}
function openQ(){const H=hls;if(!H||qlv.length<2)return toast(tr(H&&!H._ok?'q_wait':'q_none'));
const auto=H.autoLevelEnabled!==false&&(H.currentLevel<0||H.autoLevelEnabled),pl=qlv.find(l=>l.i===H.currentLevel);
$('#ql').innerHTML=`<button class="btn${auto?'':' s'}" data-q="-1">${tr('q_auto')}${auto&&pl?' ('+esc(pl.t)+')':''}</button>`+qlv.map(l=>`<button class="btn${!auto&&H.currentLevel===l.i?'':' s'}" data-q="${l.i}">${esc(l.t)}</button>`).join('');
$('#qp').classList.add('on')}
$('#pq').onclick=openQ;$('#oq').onclick=openQ;
$('#qp').onclick=e=>{if(e.target.id==='qp')closeQ()};
$('#ql').onclick=e=>{const b=e.target.closest('[data-q]');if(!b)return;const H=hls;if(!H)return closeQ();const i=+b.dataset.q;
if(i<0){H.currentLevel=-1;cfg.q='auto';showHud(tr('q_auto'))}else{H.currentLevel=i;const l=qlv.find(x=>x.i===i);if(l&&l.h)cfg.q=l.h;showHud(l?l.t:'')}
Wr('ib_s',cfg);closeQ()};
let xit=0;
const xdOpen=()=>$('#xd').classList.add('on'),xdClose=()=>$('#xd').classList.remove('on');

try{history.replaceState({ib:0},'')}catch(e){}guard();
addEventListener('popstate',()=>{
if(xit)return;guard();
if($('#xd').classList.contains('on'))return xdClose();

if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
if($('#sp').classList.contains('on'))return closeSp();
if($('#pl').classList.contains('on'))return $('#px').click();
const nb=document.querySelector('nav button.on');if(nb&&nb.dataset.t!=='ch')return tab('ch');
xdOpen()});

let hist=(()=>{const h=R('ib_h');return Array.isArray(h)?h.filter(x=>x&&x.u):[]})();
function pushH(c){if(!c)return;hist=hist.filter(x=>x.u!==c.u);hist.unshift({u:c.u,n:c.n,logo:c.logo,g:c.g});hist=hist.slice(0,20);Wr('ib_h',hist)}
function hLogo(c){const n=c.n||tr('noname');return `<div class="lg">${c.logo?`<img src="${esc(c.logo)}" loading="lazy" onerror="this.remove()">`:''}${esc(n[0]||'?')}</div>`}
function tick(){const a=$('#hc');if(!a)return;const d=new Date(),h=d.getHours();a.textContent=String(h).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
$('#hg').textContent=tr(h<5||h>=22?'h_night':h<12?'h_morn':h<18?'h_day':'h_eve');
const wd=tr('h_wd').split(',')[d.getDay()],mo=tr('h_mo').split(',')[d.getMonth()],n=d.getDate();
$('#hd').textContent=cfg.lang==='en'?`${wd}, ${mo} ${n}`:cfg.lang==='ru'?`${wd}, ${n} ${mo}`:`${wd}, ${n}-${mo}`}
const MQT='✨ Sizga maroqli hordiq va yoqimli tomosha tilaymiz. Hurmat bilan IBROHIM TV ma’muriyati ✨',MQ=`<span>${MQT}</span>`;
function renderHome(){const e=$('#hm');if(!e)return;if(!ch().length||$('#q').value.trim()||grp!=='Hammasi'){e.innerHTML='';return}
const l=hist[0];let h=`<div class="hero"><div class="mq"><div>${MQ}${MQ}</div></div><div class="hg" id="hg"></div><div class="hc" id="hc"></div><div class="hd" id="hd"></div>`;
if(l)h+=`<button class="hr" data-h="0">${hLogo(l)}<div class="n"><b>${esc(l.n||tr('noname'))}</b><small>${tr('h_cont')}</small></div></button>`;
h+='</div>';
if(hist.length)h+=`<div class="hh">${tr('h_rec')}</div><div class="hs">`+hist.slice(0,10).map((c,i)=>`<button class="hi" data-h="${i}">${hLogo(c)}<span>${esc(c.n||tr('noname'))}</span></button>`).join('')+'</div>';
e.innerHTML=h;tick()}
function playU(u){let i=ch().findIndex(x=>x.u===u);if(i<0){for(let a=0;a<lists.length;a++){if(a===act)continue;const j=lists[a].ch.findIndex(x=>x.u===u);if(j>=0){act=a;Wr('ib_a',act);cur=-1;render();i=j;break}}}if(i>=0)play(i);else toast(tr('none'))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(b&&hist[+b.dataset.h])playU(hist[+b.dataset.h].u)});

const FIX_URL='https://iptv-org.github.io/iptv/countries/uz.m3u',FIX_NAME='O‘zbekiston TV';
function ensureFix(){if(!lists.some(l=>l.fix)){const had=lists.length;lists.unshift({name:FIX_NAME,fix:1,ch:[]});if(had){act++;const c=R('ib_c');if(c&&c[0]>=0)Wr('ib_c',[c[0]+1,c[1]])}else act=0;Wr('ib_a',act);saveLists()}
const L=lists.find(l=>l.fix);const ctl=window.AbortController?new AbortController():null;const tm=setTimeout(()=>ctl&&ctl.abort(),20000);
fetch(FIX_URL,{cache:'no-cache',signal:ctl&&ctl.signal}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{clearTimeout(tm);const c=parse(t);if(!c.length)return;const cu=cur>=0&&ch()[cur]?ch()[cur].u:null,wasAct=lists[act]===L;L.ch=c;L.name=FIX_NAME;saveLists();if(wasAct&&cu){const j=L.ch.findIndex(x=>x.u===cu);cur=j}render()}).catch(()=>{clearTimeout(tm)});render()}
function resume(){const lc=R('ib_c');if(!hist.length&&lc&&lc[0]===act&&ch()[lc[1]])pushH(ch()[lc[1]]);renderHome()}
setTimeout(resume,0);
const mn=$('main');mn.addEventListener('scroll',()=>{if(lim<mt.length&&$('#v-ch').classList.contains('on')&&mn.scrollTop+mn.clientHeight>mn.scrollHeight-900)moreRows()},{passive:true});
idbGet('lists').then(l=>{if(Array.isArray(l)){const g=l.filter(x=>x&&Array.isArray(x.ch));if(g.length||!lists.length){lists=g;const a=+R('ib_a');act=a>=0&&a<lists.length?a:0;render();if(cur<0)resume()}}else if(lists.length)saveLists()}).catch(()=>{}).then(()=>{ensureFix();if(cur<0)resume()});
setTimeout(()=>$('#splash').classList.add('off'),3000);
